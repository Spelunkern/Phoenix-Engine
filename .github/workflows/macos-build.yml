# Manual macOS build (experimental) — trigger from the Actions tab.
# Produces a Mac binary artifact without owning a Mac. Does NOT run on push.
name: macOS build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake pkg-config sdl2

      - name: Install Vulkan SDK (loader + MoltenVK)
        run: |
          brew install molten-vk vulkan-loader vulkan-headers

      - name: Configure
        run: cmake --preset macos-release

      - name: Build
        run: cmake --build build/macos-release -j3

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: PhoenixEngine-macos
          path: |
            build/macos-release/PhoenixEngine
            shaders/compiled/*.spv
